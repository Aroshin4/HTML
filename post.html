<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post a Recipe</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 700px; margin: auto; }
        .form-group { margin-bottom: 20px; }
        input[type="text"], textarea { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 5px; }
        
        /* 材料と手順のレイアウト用CSS */
        .dynamic-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .dynamic-row input { margin-top: 0; flex: 1; }
        .arrow { font-weight: bold; color: #555; }
        .step-number { font-weight: bold; width: 30px; text-align: right; }
        
        .add-btn { background-color: #28a745; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .remove-btn { background-color: #dc3545; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .submit-btn { background-color: #007bff; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 4px; font-size: 16px; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <a href="/">← Back to Home</a>
    <h2>Post a New Recipe</h2>
    
    <form id="postForm">
        <div class="form-group">
            <input type="text" id="userName" placeholder="Your Name (Author)" required>
        </div>
        <div class="form-group">
            <input type="text" id="country" placeholder="Country (e.g., France)" required>
        </div>
        <div class="form-group">
            <input type="text" id="dishName" placeholder="Dish Name (e.g., Nikujaga)" required>
        </div>
        <div class="form-group">
            <input type="text" id="photoUrl" placeholder="Photo URL (e.g., https://example.com/photo.jpg)">
        </div>

        <div class="form-group">
            <h3>Ingredients & Substitutes</h3>
            <div id="ingredients-container">
                <div class="dynamic-row">
                    <input type="text" class="ing-original" placeholder="Original (e.g., Shiitake)" required>
                    <span class="arrow">➔</span>
                    <input type="text" class="ing-substitute" placeholder="Substitute (e.g., Local Mushroom)" required>
                    </div>
            </div>
            <button type="button" class="add-btn" onclick="addIngredient()">+ Add Ingredient</button>
        </div>

        <div class="form-group">
            <h3>Cooking Method</h3>
            <div id="steps-container">
                <div class="dynamic-row step-row">
                    <span class="step-number">1.</span>
                    <input type="text" class="step-input" placeholder="Describe this step" required>
                </div>
            </div>
            <button type="button" class="add-btn" onclick="addStep()">+ Add Step</button>
        </div>

        <button type="submit" class="submit-btn">Submit Recipe</button>
    </form>

    <script>
        // --- 材料入力行を追加・削除する機能 ---
        function addIngredient() {
            const container = document.getElementById('ingredients-container');
            const row = document.createElement('div');
            row.className = 'dynamic-row';
            row.innerHTML = `
                <input type="text" class="ing-original" placeholder="Original" required>
                <span class="arrow">➔</span>
                <input type="text" class="ing-substitute" placeholder="Substitute" required>
                <button type="button" class="remove-btn" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(row);
        }

        // --- 手順入力行を追加・削除・番号振り直しする機能 ---
        function addStep() {
            const container = document.getElementById('steps-container');
            const row = document.createElement('div');
            row.className = 'dynamic-row step-row';
            row.innerHTML = `
                <span class="step-number"></span>
                <input type="text" class="step-input" placeholder="Describe this step" required>
                <button type="button" class="remove-btn" onclick="removeStep(this)">X</button>
            `;
            container.appendChild(row);
            updateStepNumbers();
        }

        function removeStep(btn) {
            btn.parentElement.remove();
            updateStepNumbers();
        }

        function updateStepNumbers() {
            const steps = document.querySelectorAll('.step-number');
            steps.forEach((span, index) => {
                span.textContent = `${index + 1}.`;
            });
        }

        // --- 送信時の処理 ---
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 1. 材料データを配列から改行区切りのテキストに変換
            const originalInputs = document.querySelectorAll('.ing-original');
            const substituteInputs = document.querySelectorAll('.ing-substitute');
            let ingredientsText = '';
            let substitutesText = '';
            for (let i = 0; i < originalInputs.length; i++) {
                ingredientsText += `・${originalInputs[i].value}\n`;
                substitutesText += `・${substituteInputs[i].value}\n`;
            }

            // 2. 手順データを配列から番号付きのテキストに変換
            const stepInputs = document.querySelectorAll('.step-input');
            let methodText = '';
            for (let i = 0; i < stepInputs.length; i++) {
                methodText += `${i + 1}. ${stepInputs[i].value}\n`;
            }

            // 3. APIへ送るデータを作成（userNameを追加）
            const recipeData = {
                author: document.getElementById('userName').value, // 新規追加
                country: document.getElementById('country').value,
                dishName: document.getElementById('dishName').value,
                photoUrl: document.getElementById('photoUrl').value,
                ingredients: ingredientsText.trim(),
                substitutes: substitutesText.trim(),
                method: methodText.trim()
            };

            const response = await fetch('/api/recipes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(recipeData)
            });

            if (response.ok) {
                alert('Recipe posted successfully!');
                window.location.href = '/browse';
            }
        });
    </script>
</body>
</html>
