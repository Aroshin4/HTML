<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wa-lterna - Browse Recipes</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', 'Sawarabi Mincho', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #fff4e6, #ffe8cc);
            color: #5a3e2b;
            display: flex;
            min-height: 100vh;
        }

        /* --- サイドバー --- */
        .side-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 120px; /* 幅を拡大 */
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column; /* 縦方向に配置 */
            align-items: center;
            justify-content: flex-start; /* 上部に寄せる */
            padding-top: 20px; /* 上部に余白を追加 */
            z-index: 1000;
        }

        .side-banner p {
            margin: 0;
            font-size: 1.5rem; /* index.htmlと一致 */
            font-weight: bold;
            color: #5a3e2b;
            font-family: 'Roboto', 'Sawarabi Mincho', sans-serif;
            line-height: 1.2;
        }

        .side-logo {
            position: fixed; /* Ensure the logo stays fixed */
            top: 20px; /* Adjust the top position for the logo */
            left: 21px; /* 小さめのクリック領域を中央寄せ */
            width: 90px; /* クリック可能な範囲を小さくする */
            height: 90px; /* クリック可能な範囲を小さくする */
            background: none; /* 視覚は擬似要素で描画 */
            text-decoration: none;
            margin-bottom: 5px; /* ロゴの下に余白を追加 */
            transition: transform 0.2s ease;
            border-radius: 24px;
        }

        .side-logo:hover,
        .side-logo:focus {
            transform: scale(1.15);
            outline-offset: 4px;
        }

        .side-menu img {
            width: 160px;
            height: auto;
            transition: transform 0.2s ease;
        }

        .side-menu a:hover img,
        .side-menu a:focus img {
            transform: scale(1.15);
        }

        .side-logo::before {
            content: '';
            position: absolute;
            top: 5px;
            left: -25px; /* もとの見た目位置に合わせる */
            width: 130px;
            height: 130px;
            background: url('/images/Wa-lterna-logo.png') no-repeat center center;
            background-size: contain;
            pointer-events: none; /* 見た目はクリック対象外に */
        }

        .side-menu {
            margin-top: 100px; /* ロゴの下に配置 */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
    
        .side-menu img{
            width:170px;
            height:auto;
        }

        .side-menu a {
            text-decoration: none;
            color: #5a3e2b;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
        }

        .side-menu a:hover {
            text-decoration: underline;
        }

        /* --- メインコンテンツ --- */
        .content {
            margin-left: 140px;
            padding: 40px 20px;
            width: calc(100% - 140px);
            box-sizing: border-box;
        }

        .recipe-container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            padding: 30px;
            border-radius: 15px;
            min-height: 80vh;
        }

        .nav-links {
            margin-bottom: 20px;
            text-align: left;
        }

        .nav-links a {
            text-decoration: none;
            color: #d83434;
            font-weight: bold;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        h2 {
            font-family: 'Sawarabi Mincho', serif;
            font-size: 2.5rem;
            border-bottom: 3px solid #d83434;
            padding-bottom: 10px;
            margin-top: 0;
            color: #5a3e2b;
        }

        /* --- 検索フォーム --- */
        #searchForm {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        select, input[type="text"] {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            font-family: 'Roboto', sans-serif;
            color: #5a3e2b;
            flex: 1;
            min-width: 150px;
        }

        button {
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            border: none;
        }

        button[type="submit"] {
            background-color: #5a3e2b;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            white-space: nowrap;
        }

        button[type="submit"]:hover {
            background-color: #7a5e4b;
        }

        /* --- レシピカード --- */
        .recipe-card {
            background: #fff;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .recipe-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .thumbnail {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .no-image {
            width: 100%;
            height: 250px;
            background-color: #f0f0f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            margin-bottom: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        .recipe-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            color: #5a3e2b;
            font-family: 'Sawarabi Mincho', serif;
        }

        .recipe-card a {
            text-decoration: none;
            color: inherit;
        }

        .recipe-card a:hover {
            color: #d83434;
        }

        .like-btn {
            background-color: #ff7f50;
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            margin-left: 10px;
            font-size: 0.9rem;
        }

        .like-btn:hover {
            background-color: #e67348;
        }

        .like-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* --- ページネーション --- */
        #pagination {
            margin-top: 40px;
            text-align: center;
            margin-bottom: 40px;
        }

        .pagination-btn {
            background-color: #ff7f50;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin: 0 10px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .pagination-btn:hover {
            background-color: #e67348;
        }

        /* スマホ対応 */
        @media (max-width: 768px) {
            .side-banner { display: none; }
            .content { margin-left: 0; width: 100%; padding: 20px; }
            #searchForm { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <div class="side-banner">
        <p>Menu</p>
        <a href="/" class="side-logo" aria-label="ホームに戻る"></a>

        <nav class="side-menu">
            <a href="/browse">
                <img src="/images/Search-button.png" alt="Browse Recipes">
            </a>

            <a href="/post">
                <img src="/images/Post-button.png" alt="Post a New Recipe">
            </a>
        </nav>
    </div>

    <div class="content">
        <div class="recipe-container">
            
            <div class="nav-links">
                <a href="/">← Back to Home</a>
            </div>

            <h2>Browse & Search Recipes</h2>
            
            <form id="searchForm">
                <select id="searchCountry">
                    <option value="">-- All Countries --</option>
                </select>
                
                <input type="text" id="searchDishName" placeholder="Filter by Dish Name" list="dish-list">
                <datalist id="dish-list"></datalist>

                <select id="sortOrder">
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                    <option value="likes">Most Liked</option>
                </select>
                
                <button type="submit">Search</button>
            </form>
            
            <div id="results"></div>
            <div id="pagination"></div>

        </div>
    </div>

    <script>
        window.onload = () => {
            fetchAndDisplayRecipes();
            populateFilters(); 
        };

        async function populateFilters() {
            const countryRes = await fetch('/api/countries');
            const countries = await countryRes.json();
            const countrySelect = document.getElementById('searchCountry');
            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                countrySelect.appendChild(option);
            });

            const dishRes = await fetch('/api/dish-names');
            const dishNames = await dishRes.json();
            const dataList = document.getElementById('dish-list');
            dataList.innerHTML = ''; 
            dishNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                dataList.appendChild(option);
            });
        }

        let currentPage = 1;

        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            currentPage = 1;
            const country = document.getElementById('searchCountry').value;
            const dishName = document.getElementById('searchDishName').value;
            const sortOrder = document.getElementById('sortOrder').value;
            fetchAndDisplayRecipes(country, dishName, currentPage, sortOrder);
        });

        async function fetchAndDisplayRecipes(country = '', dishName = '', page = 1, sortOrder = 'newest') {
            let url = `/api/recipes?page=${page}&sort=${sortOrder}&`;
            if (country) url += `country=${encodeURIComponent(country)}&`;
            if (dishName) url += `dishName=${encodeURIComponent(dishName)}`;

            const response = await fetch(url);
            const data = await response.json(); 
            const recipes = data.recipes;
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = ''; 

            if (recipes.length === 0) {
                resultsDiv.innerHTML = '<p>No recipes found.</p>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const likedRecipes = JSON.parse(localStorage.getItem('likedRecipes') || '[]');

            recipes.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                const photoPath = recipe.photo ? `/uploads/${recipe.photo}` : '';
                const thumbnailHtml = photoPath 
                    ? `<a href="/recipe/${recipe.id}"><img src="${photoPath}" alt="${recipe.dishName}" class="thumbnail"></a>`
                    : `<a href="/recipe/${recipe.id}" class="no-image">No Image<br>(Click to view details)</a>`;

                const isLiked = likedRecipes.includes(recipe.id);
                
                // [修正] ボタンにCSSで指定したクラス (class="like-btn") を適用しました
                const likeBtnHtml = isLiked 
                    ? `<button disabled class="like-btn">Liked❤️</button>`
                    : `<button id="like-btn-${recipe.id}" class="like-btn" onclick="likeRecipe(${recipe.id})">Like!</button>`;

                card.innerHTML = `
                    ${thumbnailHtml}
                    <h3>
                        <a href="/recipe/${recipe.id}">
                            ${recipe.dishName}
                        </a>
                        <span style="font-size: 0.8em; color: #666;">(${recipe.country})</span>
                    </h3>
                    
                    <p style="display: flex; align-items: center;">
                        ❤️ Likes: <span id="likes-${recipe.id}" style="margin: 0 10px;">${recipe.likes}</span> 
                        ${likeBtnHtml}
                    </p>
                `;
                resultsDiv.appendChild(card);
            });

            renderPagination(data.totalPages, data.currentPage, country, dishName, sortOrder);
        }

        function renderPagination(totalPages, currentPage, country, dishName, sortOrder) {
            const paginationDiv = document.getElementById('pagination');
            paginationDiv.innerHTML = '';

            if (totalPages <= 1) return;

            // [修正] ページ送りボタンにCSSクラス (class="pagination-btn") を適用しました
            if (currentPage > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.textContent = '← Previous';
                prevBtn.className = 'pagination-btn'; 
                prevBtn.onclick = () => {
                    fetchAndDisplayRecipes(country, dishName, currentPage - 1, sortOrder);
                    window.scrollTo(0, 0); 
                };
                paginationDiv.appendChild(prevBtn);
            }

            const pageInfo = document.createElement('span');
            pageInfo.textContent = ` Page ${currentPage} of ${totalPages} `;
            pageInfo.style.margin = '0 15px';
            pageInfo.style.fontWeight = 'bold';
            paginationDiv.appendChild(pageInfo);

            if (currentPage < totalPages) {
                const nextBtn = document.createElement('button');
                nextBtn.textContent = 'Next →';
                nextBtn.className = 'pagination-btn';
                nextBtn.onclick = () => {
                    fetchAndDisplayRecipes(country, dishName, currentPage + 1, sortOrder);
                    window.scrollTo(0, 0); 
                };
                paginationDiv.appendChild(nextBtn);
            }
        }

        async function likeRecipe(id) {
            const response = await fetch(`/api/recipes/${id}/like`, { method: 'POST' });
            if (response.ok) {
                const data = await response.json();
                document.getElementById(`likes-${id}`).innerText = data.likes;
                
                const likedRecipes = JSON.parse(localStorage.getItem('likedRecipes') || '[]');
                if (!likedRecipes.includes(id)) {
                    likedRecipes.push(id);
                    localStorage.setItem('likedRecipes', JSON.stringify(likedRecipes));
                }
                
                const btn = document.getElementById(`like-btn-${id}`);
                if (btn) {
                    btn.outerHTML = `<button disabled class="like-btn">Liked❤️</button>`;
                }
            }
        }
    </script>
</body>
</html>
