<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browse Recipes</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .recipe-card { border: 1px solid #007bff; padding: 15px; margin-top: 15px; border-radius: 5px; }
        
        .thumbnail { width: 100%; height: 250px; object-fit: cover; border-radius: 5px; transition: opacity 0.3s; }
        .thumbnail:hover { opacity: 0.8; }
        .no-image { width: 100%; height: 250px; background-color: #e9ecef; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #6c757d; font-weight: bold; text-decoration: none; transition: opacity 0.3s; text-align: center;}
        .no-image:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <a href="/">← Back to Home</a>
    <h2>Browse & Search Recipes</h2>
    
    <form id="searchForm" style="margin-bottom: 20px;">
        <select id="searchCountry" style="padding: 5px; margin-right: 10px;">
            <option value="">-- All Countries --</option>
        </select>
        
        <input type="text" id="searchDishName" placeholder="Filter by Dish Name" list="dish-list" style="padding: 5px;">
        <datalist id="dish-list"></datalist>
        
        <button type="submit" style="padding: 5px 15px;">Search</button>
    </form>
    
    <div id="results"></div>

    <script>
        window.onload = () => {
            fetchAndDisplayRecipes();
            populateFilters(); 
        };

        async function populateFilters() {
            const countryRes = await fetch('/api/countries');
            const countries = await countryRes.json();
            const countrySelect = document.getElementById('searchCountry');
            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                countrySelect.appendChild(option);
            });

            const dishRes = await fetch('/api/dish-names');
            const dishNames = await dishRes.json();
            const dataList = document.getElementById('dish-list');
            dataList.innerHTML = ''; 
            dishNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                dataList.appendChild(option);
            });
        }

        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const country = document.getElementById('searchCountry').value;
            const dishName = document.getElementById('searchDishName').value;
            fetchAndDisplayRecipes(country, dishName);
        });

        async function fetchAndDisplayRecipes(country = '', dishName = '') {
            let url = '/api/recipes?';
            if (country) url += `country=${encodeURIComponent(country)}&`;
            if (dishName) url += `dishName=${encodeURIComponent(dishName)}`;

            const response = await fetch(url);
            const recipes = await response.json();
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = ''; 

            if (recipes.length === 0) {
                resultsDiv.innerHTML = '<p>No recipes found.</p>';
                return;
            }

            // ブラウザに保存されている「いいねしたレシピID」のリストを取得
            const likedRecipes = JSON.parse(localStorage.getItem('likedRecipes') || '[]');

            recipes.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                const thumbnailHtml = recipe.photoUrl 
                    ? `<a href="/recipe/${recipe.id}"><img src="${recipe.photoUrl}" alt="${recipe.dishName}" class="thumbnail"></a>`
                    : `<a href="/recipe/${recipe.id}" class="no-image">No Image<br>(Click to view details)</a>`;

                // 過去にいいねを押しているかでボタンのHTMLを切り替える
                const isLiked = likedRecipes.includes(recipe.id);
                const likeBtnHtml = isLiked 
                    ? `<button disabled style="margin-left: 10px; padding: 5px; cursor: not-allowed; background-color: #ccc; border: 1px solid #999; border-radius: 4px;">Liked❤️</button>`
                    : `<button id="like-btn-${recipe.id}" onclick="likeRecipe(${recipe.id})" style="margin-left: 10px; padding: 5px; cursor: pointer; border-radius: 4px;">Like!</button>`;

                card.innerHTML = `
                    ${thumbnailHtml}
                    <h3 style="margin-top: 15px;">
                        <a href="/recipe/${recipe.id}" style="text-decoration: none; color: inherit;">
                            ${recipe.dishName}
                        </a>
                        <span style="font-size: 0.8em; color: #666;">(${recipe.country})</span>
                    </h3>
                    
                    <p>❤️ Likes: <span id="likes-${recipe.id}">${recipe.likes}</span> 
                       ${likeBtnHtml}
                    </p>
                `;
                resultsDiv.appendChild(card);
            });
        }

        async function likeRecipe(id) {
            const response = await fetch(`/api/recipes/${id}/like`, { method: 'POST' });
            if (response.ok) {
                const data = await response.json();
                document.getElementById(`likes-${id}`).innerText = data.likes;
                
                // ブラウザのLocalStorageに「いいねしたID」を保存する
                const likedRecipes = JSON.parse(localStorage.getItem('likedRecipes') || '[]');
                if (!likedRecipes.includes(id)) {
                    likedRecipes.push(id);
                    localStorage.setItem('likedRecipes', JSON.stringify(likedRecipes));
                }
                
                // クリックされたボタンを「Liked❤️」に変えて無効化する
                const btn = document.getElementById(`like-btn-${id}`);
                if (btn) {
                    btn.outerHTML = `<button disabled style="margin-left: 10px; padding: 5px; cursor: not-allowed; background-color: #ccc; border: 1px solid #999; border-radius: 4px;">Liked❤️</button>`;
                }
            }
        }
    </script>
</body>
</html>
