<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wa-lterna - Post a Recipe</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', 'Sawarabi Mincho', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #fff4e6, #ffe8cc);
            color: #5a3e2b;
            display: flex;
            min-height: 100vh;
        }

        /* --- サイドバー --- */
        .side-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 120px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px;
            z-index: 1000;
        }

        .side-banner p {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
            color: #5a3e2b;
        }

        .side-banner a {
            position: fixed;
            top: 20px;
            left: -14px;
            width: 150px;
            height: 150px;
            background: url('/images/Wa-lterna-logo.png') no-repeat center center;
            background-size: contain;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .side-banner a:hover {
            transform: scale(1.05);
        }

        /* --- メインコンテンツ --- */
        .content {
            margin-left: 140px;
            padding: 40px 20px;
            width: calc(100% - 140px);
            box-sizing: border-box;
        }

        .recipe-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .nav-links {
            margin-bottom: 20px;
            text-align: left;
        }

        .nav-links a {
            margin-right: 20px;
            text-decoration: none;
            color: #d83434;
            font-weight: bold;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        h2 {
            font-family: 'Sawarabi Mincho', serif;
            font-size: 2.5rem;
            border-bottom: 3px solid #d83434;
            padding-bottom: 10px;
            margin-top: 0;
            color: #5a3e2b;
        }

        h3 {
            border-left: 5px solid #ff7f50;
            padding-left: 15px;
            margin-top: 30px;
            color: #5a3e2b;
        }

        /* --- フォームスタイル --- */
        .form-group { margin-bottom: 25px; }
        
        input[type="text"], textarea, select { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            margin-top: 5px; 
            font-size: 16px; 
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.9);
            font-family: 'Roboto', sans-serif;
            color: #5a3e2b;
        }
        
        input[type="file"] { margin-top: 5px; font-size: 16px; font-family: 'Roboto', sans-serif; }
        
        .dynamic-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .dynamic-row input { margin-top: 0; flex: 1; }
        .arrow { font-weight: bold; color: #555; }
        .step-number { font-weight: bold; width: 30px; text-align: right; }
        
        button { transition: 0.3s; font-family: 'Roboto', sans-serif; }

        .add-btn { background-color: #5a3e2b; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 25px; font-size: 14px; font-weight: bold; margin-top: 10px;}
        .add-btn:hover { background-color: #7a5e4b; }

        .remove-btn { background-color: #d83434; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .remove-btn:hover { background-color: #b02a2a; }

        .submit-btn { background-color: #ff7f50; color: white; border: none; padding: 15px 30px; cursor: pointer; border-radius: 40px; font-size: 18px; width: 100%; margin-top: 40px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .submit-btn:hover { background-color: #e67348; transform: translateY(-2px); box-shadow: 0 6px 10px rgba(0,0,0,0.15); }

        /* スマホ対応 */
        @media (max-width: 768px) {
            .side-banner { display: none; }
            .content { margin-left: 0; width: 100%; padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="side-banner">
        <p>Menu</p>
        <a href="/" aria-label="Home"></a>
    </div>

    <div class="content">
        <div class="recipe-container">
            
            <div class="nav-links">
                <a href="/">← Back to Home</a>
            </div>

            <h2>Post a New Recipe</h2>
            
            <form id="postForm">
                
                <div class="form-group">
                    <label for="userName" style="font-weight:bold;">Author Name</label>
                    <input type="text" id="userName" placeholder="Your Name" required oninvalid="this.setCustomValidity('Please fill out this field.')" oninput="this.setCustomValidity('')">
                </div>
                
                <div class="form-group">
                    <label for="country" style="font-weight:bold;">Country</label>
                    <select id="country" required oninvalid="this.setCustomValidity('Please select an item in the list.')" oninput="this.setCustomValidity('')">
                        <option value="" disabled selected>Select a Country</option>
                        <option value="France">France</option>
                        <option value="Italy">Italy</option>
                        <option value="South Korea">South Korea</option>
                        <option value="USA">USA</option>
                        <option value="UK">UK</option>
                        <option value="Australia">Australia</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dishName" style="font-weight:bold;">Dish Name</label>
                    <input type="text" id="dishName" placeholder="e.g., Nikujaga" required oninvalid="this.setCustomValidity('Please fill out this field.')" oninput="this.setCustomValidity('')">
                </div>
                
                <div class="form-group">
                    <label for="photo" style="font-weight:bold;">Photo (Optional)</label>
                    <input type="file" id="photo" accept="image/*">
                </div>

                <div class="form-group">
                    <h3>Ingredients & Substitutes</h3>
                    <p style="font-size: 14px; color: #666; margin-top: 0;">* Leave "Substitute" blank if not needed.</p>
                    
                    <div id="ingredients-container">
                        <div class="dynamic-row">
                            <input type="text" class="ing-original" placeholder="Original (e.g., Soy Sauce)" required oninvalid="this.setCustomValidity('Please fill out this field.')" oninput="this.setCustomValidity('')">
                            <span class="arrow">➔</span>
                            <input type="text" class="ing-substitute" placeholder="Substitute (Optional)">
                        </div>
                    </div>
                    <button type="button" class="add-btn" onclick="addIngredient()">+ Add Ingredient</button>
                </div>

                <div class="form-group">
                    <h3>Cooking Method</h3>
                    <div id="steps-container">
                        <div class="dynamic-row step-row">
                            <span class="step-number">1.</span>
                            <input type="text" class="step-input" placeholder="Describe this step" required oninvalid="this.setCustomValidity('Please fill out this field.')" oninput="this.setCustomValidity('')">
                        </div>
                    </div>
                    <button type="button" class="add-btn" onclick="addStep()">+ Add Step</button>
                </div>

                <button type="submit" class="submit-btn">Submit Recipe</button>
            </form>

        </div>
    </div>

    <script>
        function addIngredient() {
            const container = document.getElementById('ingredients-container');
            const row = document.createElement('div');
            row.className = 'dynamic-row';
            row.innerHTML = `
                <input type="text" class="ing-original" placeholder="Original" required oninvalid="this.setCustomValidity('Please fill out this field.')" oninput="this.setCustomValidity('')">
                <span class="arrow">➔</span>
                <input type="text" class="ing-substitute" placeholder="Substitute (Optional)">
                <button type="button" class="remove-btn" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(row);
        }

        function addStep() {
            const container = document.getElementById('steps-container');
            const row = document.createElement('div');
            row.className = 'dynamic-row step-row';
            row.innerHTML = `
                <span class="step-number"></span>
                <input type="text" class="step-input" placeholder="Describe this step" required oninvalid="this.setCustomValidity('Please fill out this field.')" oninput="this.setCustomValidity('')">
                <button type="button" class="remove-btn" onclick="removeStep(this)">X</button>
            `;
            container.appendChild(row);
            updateStepNumbers();
        }

        function removeStep(btn) {
            btn.parentElement.remove();
            updateStepNumbers();
        }

        function updateStepNumbers() {
            const steps = document.querySelectorAll('.step-number');
            steps.forEach((span, index) => {
                span.textContent = `${index + 1}.`;
            });
        }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const originalInputs = document.querySelectorAll('.ing-original');
            const substituteInputs = document.querySelectorAll('.ing-substitute');
            let ingredientsText = '';
            let substitutesText = '';
            
            for (let i = 0; i < originalInputs.length; i++) {
                ingredientsText += `・${originalInputs[i].value}\n`;
                
                const subValue = substituteInputs[i].value.trim();
                if (subValue !== '') {
                    substitutesText += `・${subValue}\n`;
                } else {
                    substitutesText += `・(None)\n`;
                }
            }

            const stepInputs = document.querySelectorAll('.step-input');
            let methodText = '';
            for (let i = 0; i < stepInputs.length; i++) {
                methodText += `${i + 1}. ${stepInputs[i].value}\n`;
            }

            const formData = new FormData();
            formData.append('author', document.getElementById('userName').value);
            formData.append('country', document.getElementById('country').value);
            formData.append('dishName', document.getElementById('dishName').value);
            formData.append('ingredients', ingredientsText.trim());
            formData.append('substitutes', substitutesText.trim());
            formData.append('method', methodText.trim());

            const photoFile = document.getElementById('photo').files[0];
            if (photoFile) {
                formData.append('photo', photoFile);
            }

            try {
                const response = await fetch('/api/recipes', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert('Recipe posted successfully!');
                    window.location.href = '/browse';
                } else {
                    alert('Failed to submit the recipe. Please check the terminal for errors.');
                }
            } catch (error) {
                alert('Connection error. Is the server running?');
                console.error(error);
            }
        });
    </script>
</body>
</html>
