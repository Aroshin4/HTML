# docker/docker-compose.yml（例）
services:
  db:
    image: mysql:8.0
    container_name: jpfood_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: jpfood
      MYSQL_USER: jpuser
      MYSQL_PASSWORD: jppw
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  adminer:
    image: adminer:latest
    container_name: jpfood_adminer
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: node:20
    container_name: jpfood_app
    working_dir: /usr/src/app
    volumes:
      - ../app:/usr/src/app
      - ..public:/usr/src/app/public
    command: bash -lc "npm install && npm run start"
    environment:
      DB_HOST: db
      DB_USER: jpuser
      DB_PASSWORD: jppw
      DB_NAME: jpfood
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: